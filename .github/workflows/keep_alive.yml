name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render free instance from spinning down
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Check Endpoint
        run: |
          curl -s -f https://the-tss-computer-store.onrender.com/api/health || echo "Render backend pinged"
